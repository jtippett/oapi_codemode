name: Publish to Hex

# Manual trigger, deliberately: publishing is the last step of a release,
# after the version bump is on master and CI is green.
#
# Requires the `hex` environment with a HEX_API_KEY secret (a hex.pm API key
# with write permission, from https://hex.pm/dashboard/keys).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: hex
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Fetch deps
        run: mix deps.get

      - name: Publish
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
